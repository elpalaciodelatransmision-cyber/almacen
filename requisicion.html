<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requisición de piezas · El Palacio de la Transmisión</title>
<style>
/* Formulario para llenar a mano: 5 renglones, un tercio de hoja Carta. Se imprime una sola, arriba de la hoja.
   Medidas en milímetros para que salgan exactas al imprimir. */
@page { size: letter; margin: 8mm 12mm; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #e9edf1; color: #000; font-family: Arial, Helvetica, sans-serif; }
.hoja { width: 191.9mm; margin: 12mm auto; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
@media print { html, body { background: #fff; } .hoja { margin: 0; box-shadow: none; } .ayuda { display: none; } }

/* Cada tercio de hoja: (279.4 − 16) / 3 = 87.8 mm */
.media { height: 87.8mm; padding: 3mm 0 4.5mm; display: flex; flex-direction: column; overflow: hidden; }
.media + .media { border-top: 1px dashed #777; position: relative; overflow: visible; }
.media + .media::before { content: "✂  cortar aquí"; position: absolute; top: -2.2mm; left: 50%; transform: translateX(-50%); background: #fff; padding: 0 3mm; font-size: 7.5pt; color: #777; }

h1 { margin: 0; text-align: center; font-size: 12.5pt; letter-spacing: .02em; }
h2 { margin: .5mm 0 0; text-align: center; font-size: 8.5pt; font-weight: 700; }

/* Datos de arriba: cada campo con su línea para escribir */
.datos { display: grid; grid-template-columns: 40mm 1fr 36mm; gap: 6mm; margin: 2mm 0 2mm; align-items: end; }
.campo { display: flex; align-items: flex-end; gap: 2mm; font-size: 9.5pt; font-weight: 700; }
.campo .linea { flex: 1; border-bottom: 1.2px solid #000; height: 6mm; }
.fecha .partes { display: flex; align-items: flex-end; gap: 1.5mm; flex: 1; }
.fecha .partes span { border-bottom: 1.2px solid #000; height: 6mm; }
.fecha .partes i { font-style: normal; font-weight: 400; font-size: 12pt; }

/* Tabla: 5 renglones altos para letra a mano */
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th, td { border: 1.2px solid #000; }
th { background: #e3e3e3; font-size: 8pt; font-weight: 700; height: 7.5mm; padding: .8mm 1.5mm; text-align: center; vertical-align: middle; line-height: 1.12; }
th small { display: block; font-weight: 400; font-size: 6.5pt; }
td { height: 8.2mm; }
col.cant { width: 15mm; } col.cod { width: 30mm; } col.desc { width: auto; } col.veh { width: 48mm; } col.placa { width: 27mm; }

/* Firmas */
.firmas { display: grid; grid-template-columns: 1fr 1fr; gap: 14mm; margin-top: auto; }
.firma .espacio { height: 7mm; border-bottom: 1.2px solid #000; }
.firma b { display: block; margin-top: .6mm; font-size: 8.5pt; text-align: center; }
.firma small { display: block; text-align: center; font-size: 6.5pt; }
.pie { margin-top: 2.5mm; font-size: 7.5pt; color: #333; text-align: center; }

.ayuda { width: 191.9mm; margin: 0 auto 12mm; font-size: 14px; color: #333; }
.ayuda button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid #333; background: #12794c; color: #fff; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="hoja" id="hoja"></div>
<div class="ayuda"><button onclick="print()">Imprimir</button> &nbsp;Sale <b>una requisición arriba de la hoja</b>. Elige tamaño <b>Carta</b>, escala <b>100 %</b> y márgenes <b>Predeterminados</b>.</div>

<template id="req">
  <div class="media">
    <h1>EL PALACIO DE LA TRANSMISIÓN</h1>
    <h2>REQUISICIÓN DE PIEZAS E INSUMOS · SALIDA DE ALMACÉN</h2>
    <div class="datos">
      <div class="campo">No.<span class="linea"></span></div>
      <div class="campo fecha">Fecha:<span class="partes"><span style="width:11mm"></span><i>/</i><span style="width:11mm"></span><i>/</i><span style="width:17mm"></span></span></div>
      <div class="campo">Hora:<span class="linea"></span></div>
    </div>
    <table>
      <colgroup><col class="cant"><col class="cod"><col class="desc"><col class="veh"><col class="placa"></colgroup>
      <thead><tr><th>Cant.</th><th>Código / Pieza<small>(ej. ACE-001)</small></th><th>DESCRIPCIÓN</th><th>MARCA Y MODELO DEL VEHÍCULO</th><th>PLACA</th></tr></thead>
      <tbody>
        <tr><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td><td></td></tr>
      </tbody>
    </table>
    <div class="firmas">
      <div class="firma"><div class="espacio"></div><b>Recibe (mecánico)</b><small>Nombre y firma</small></div>
      <div class="firma"><div class="espacio"></div><b>Entrega (almacén)</b><small>Nombre y firma</small></div>
    </div>
  </div>
</template>
<script>
// Una sola requisición, arriba de la hoja
const t = document.getElementById('req'), h = document.getElementById('hoja');
h.append(t.content.cloneNode(true));
</script>
</body>
</html>
